[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dohnuts"
version = "0.1.0"
readme = "README.md"
description = "Python tools for training, running, and evaluating Dohnuts models."
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "torch>=2.9",
  "torchvision>=0.24",
  "transformers>=5.17,<5.18",
  "peft>=0.21,<0.22",
  "Pillow>=11",
  "huggingface-hub>=1.0,<2",
  "flash-linear-attention[rocm]==0.5.2",
]

[project.optional-dependencies]
train = ["pyarrow>=25", "scikit-learn>=1.9", "pandas>=3.0", "datasets>=4"]
agent = ["bub @ git+https://github.com/bubbuild/bub.git@9bf70488e22a44eeb875a9d55d9a7d352b82e381"]

[project.urls]
Homepage = "https://github.com/PsiACE/dohnuts"
Documentation = "https://github.com/PsiACE/dohnuts/tree/main/docs"
Models = "https://huggingface.co/PsiACE/Dohnuts-0.1.0-0.8B"
Issues = "https://github.com/PsiACE/dohnuts/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
