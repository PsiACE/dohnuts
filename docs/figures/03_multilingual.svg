  <g id="text_21">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #586671" transform="translate(45.36 484.658437)">MASSIVE intent uses 20 candidates; XNLI uses 3. The 51-language and 14-language suites are distinct evaluations.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #586671" transform="translate(45.36 498.608438)">On the 51-language suite, accuracy exceeds 15% (3× random) in 51/51 languages for Dohnuts and 45/51 for multilingual.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #586671" transform="translate(45.36 512.558437)">Dohnuts: measured. Laya multilingual: published reference. Historical byte identity cannot be independently verified.</text>
